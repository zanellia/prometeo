name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Build BLASFEO and the C backend (Linux)
        if: runner.os == 'Linux'
        working-directory: prometeo/cpmt
        run: make install_shared TARGET=GENERIC

      - name: Build BLASFEO and the C backend (macOS)
        if: runner.os == 'macOS'
        working-directory: prometeo/cpmt
        run: make install_shared CC=clang TARGET=GENERIC OPT_LD_FLAGS=-Wl,-undefined,dynamic_lookup

      - name: Install prometeo
        run: python -m pip install -e .[test]

      - name: Run tests
        run: |
          export LD_LIBRARY_PATH=$PWD/prometeo/lib/blasfeo:$PWD/prometeo/lib/prometeo:$LD_LIBRARY_PATH
          export DYLD_LIBRARY_PATH=$PWD/prometeo/lib/blasfeo:$PWD/prometeo/lib/prometeo:$DYLD_LIBRARY_PATH
          python -m pytest -v tests
